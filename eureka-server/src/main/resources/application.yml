server:
  port: 8761
spring:
  application:
    name: eureka-server
  config:
    # Tracing comum a todas as aplicacoes (freela-observability).
    import: classpath:freela/observabilidade.yml
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false
logging:
  level:
    root: INFO
    com.netflix.eureka: INFO
