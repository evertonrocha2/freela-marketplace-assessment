server:
  port: 8761
spring:
  application:
    name: eureka-server
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
    export:
      zipkin:
        # Nome da propriedade no Spring Boot 4. O antigo management.zipkin.tracing.endpoint nao e
        # mais lido, e com ele a variavel ZIPKIN_URL era ignorada sem aviso.
        endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false
logging:
  level:
    root: INFO
    com.netflix.eureka: INFO
