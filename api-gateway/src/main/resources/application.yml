server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: contrato-service
              uri: lb://contrato-service
              predicates:
                - Path=/api/contratos/**
            - id: notificacao-service
              uri: lb://notificacao-service
              predicates:
                - Path=/api/notificacoes/**
            - id: reputacao-service
              uri: lb://reputacao-service
              predicates:
                - Path=/api/reputacoes/**
            - id: auditoria-service
              uri: lb://auditoria-service
              predicates:
                - Path=/api/auditoria/**
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
logging:
  level:
    root: INFO
    br.com.freela: INFO
