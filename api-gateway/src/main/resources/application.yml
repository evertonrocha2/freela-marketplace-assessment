server:
  port: 8080
spring:
  application:
    name: api-gateway
  reactor:
    # Em WebFlux uma requisicao troca de thread varias vezes. Com "auto", o contexto de trace e
    # restaurado na thread que estiver executando cada etapa, e as linhas de log do gateway saem
    # com traceId como as dos outros servicos.
    context-propagation: auto
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: contrato-service
              uri: lb://contrato-service
              predicates:
                - Path=/api/contratos/**
            - id: notificacao-service
              uri: lb://notificacao-service
              predicates:
                - Path=/api/notificacoes/**
            - id: reputacao-service
              uri: lb://reputacao-service
              predicates:
                - Path=/api/reputacoes/**
            - id: auditoria-service
              uri: lb://auditoria-service
              predicates:
                - Path=/api/auditoria/**
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
    export:
      zipkin:
        # Nome da propriedade no Spring Boot 4. O antigo management.zipkin.tracing.endpoint nao e
        # mais lido, e com ele a variavel ZIPKIN_URL era ignorada sem aviso.
        endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
logging:
  level:
    root: INFO
    br.com.freela: INFO
