server:
  port: 8082

spring:
  application:
    name: notificacao-service
  config:
    # Kafka, JPA, tracing, Eureka e logs vem da configuracao comum dos consumidores (freela-common).
    import: classpath:freela/consumidor.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notificacao_db}
    username: ${DB_USER:freela}
    password: ${DB_PASSWORD:freela}
