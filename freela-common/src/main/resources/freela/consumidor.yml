# Configuracao comum aos tres consumidores (notificacao, reputacao e auditoria). Cada um importa
# este arquivo pelo spring.config.import e declara no proprio application.yml so porta, nome e
# banco. Valores importados prevalecem sobre os do arquivo que importa, por isso nenhuma chave
# daqui deve se repetir la.
spring:
  config:
    import: classpath:freela/observabilidade.yml
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${freela.kafka.grupo-consumidor}
      auto-offset-reset: earliest
      # Commit manual pelo container, depois do processamento. Com auto-commit, o offset poderia
      # avancar antes da transacao terminar e a mensagem se perderia em caso de falha.
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 20
    producer:
      # Usado apenas pelo DeadLetterPublishingRecoverer ao mover mensagens para o DLT.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    listener:
      ack-mode: record
      # Instrumentacao de observabilidade: extrai o traceparent da mensagem e continua o mesmo
      # trace iniciado no API Gateway.
      observation-enabled: true

freela:
  kafka:
    # Um grupo por servico: cada um recebe uma copia de todos os eventos e guarda o proprio offset.
    grupo-consumidor: ${spring.application.name}
    # Uma thread por particao do topico. Acima disso sobram consumidores sem particao atribuida.
    concorrencia: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

logging:
  level:
    root: INFO
    br.com.freela: INFO
