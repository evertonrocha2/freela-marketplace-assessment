apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 2000
      # Transforma o traceId que sai no JSON de cada linha de log em um link para o trace
      # correspondente no Zipkin. E o que liga log centralizado e tracing distribuido em um clique.
      derivedFields:
        - name: traceId
          matcherType: regex
          matcherRegex: '"traceId"\s*:\s*"([a-f0-9]+)"'
          url: "$${__value.raw}"
          datasourceUid: zipkin
          urlDisplayLabel: "Abrir trace no Zipkin"

  - name: Zipkin
    type: zipkin
    uid: zipkin
    access: proxy
    url: http://zipkin:9411
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: true
        customQuery: false
