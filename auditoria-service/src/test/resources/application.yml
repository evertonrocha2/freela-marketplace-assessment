spring:
  application:
    name: auditoria-service
  datasource:
    url: jdbc:h2:mem:auditoria_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:59092
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      # Os testes chamam o servico diretamente; nenhum container precisa subir nem falar com broker.
      auto-startup: false

freela:
  kafka:
    grupo-consumidor: auditoria-service
    concorrencia: 1

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  tracing:
    enabled: false

logging:
  level:
    root: WARN
    br.com.freela: INFO
