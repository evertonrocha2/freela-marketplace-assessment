# Tracing comum a todas as aplicacoes. Cada uma importa este arquivo pelo spring.config.import do
# proprio application.yml.
management:
  tracing:
    sampling:
      # 100% em ambiente de avaliacao: todo fluxo precisa aparecer no Zipkin.
      probability: 1.0
    propagation:
      type: w3c
    export:
      zipkin:
        # Nome da propriedade no Spring Boot 4. O antigo management.zipkin.tracing.endpoint nao e
        # mais lido, e com ele a variavel ZIPKIN_URL era ignorada sem aviso.
        endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
